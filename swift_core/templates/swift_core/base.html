{% load django_htmx %}
<!doctype html>
<html lang="en">
  <head>
    <div>{% htmx_script %}</div>
    {% block head %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    {% endblock head %}
  </head>
  <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
    {% block body %}{% endblock body %}
  </body>
</html>
